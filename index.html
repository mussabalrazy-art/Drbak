<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دربك | Drbak</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f2f7f4;color:#17352b}
header{background:#087f5b;color:white;padding:25px 20px;border-radius:0 0 25px 25px}
.logo{font-size:32px;font-weight:bold}
header p{line-height:1.8}
main{padding:18px;max-width:500px;margin:auto}
.card{background:white;padding:20px;border-radius:20px;margin:15px 0;box-shadow:0 4px 15px #0001}
h2{margin-top:0}
label{display:block;margin:15px 0 7px}
input,select{width:100%;padding:14px;border:1px solid #d4e0d9;border-radius:10px;font-size:16px;background:white}
button{width:100%;padding:15px;background:#087f5b;color:white;border:0;border-radius:12px;font-size:17px;font-weight:bold;margin-top:18px}
.modes{display:flex;gap:10px}
.mode{flex:1;padding:14px;text-align:center;background:#e6f3ec;border-radius:12px;font-weight:bold}
.note{color:#66766d;font-size:13px;line-height:1.8}
footer{text-align:center;padding:20px;color:#66766d}
</style>
</head>
<body>
<header>
  <div class="logo">دربك Drbak</div>
  <p>مشوارك علينا، واصل بأمان.<br>اطلب مشوارك بكل سهولة.</p>
</header>

<main>
  <div class="card">
    <h2>🚗 أطلب مشوارك</h2>
    <p>إنت داير تمشي وين؟</p>

    <div class="modes">
      <div class="mode">🚕 راكب</div>
      <div class="mode">🛺 سائق</div>
    </div>

    <label for="city">المدينة</label>
    <select id="city">
      <option>الخرطوم</option>
      <option>أم درمان</option>
      <option>بحري</option>
    </select>

    <label for="from">مكان الانطلاق</label>
    <input id="from" placeholder="مثلاً: الثورة، الحارة 11">

    <label for="to">الوجهة</label>
    <input id="to" placeholder="مثلاً: السوق العربي">

    <label for="payment">طريقة الدفع</label>
    <select id="payment">
      <option>كاش</option>
      <option>تحويل بنكي</option>
      <option>دفع إلكتروني</option>
    </select>

    <button onclick="requestRide()">اطلب مشوار</button>
    <p id="result" class="note"></p>
  </div>

  <div class="card">
    <h2>📍 دربك معاك</h2>
    <p>من الخرطوم إلى بحري وأم درمان، هدفنا نخلي مشاويرك أسهل.</p>
    <p class="note">دي نسخة أولية للتصميم. طلبات المشاوير الحقيقية تحتاج ربط التطبيق بالخادم وحسابات السائقين.</p>
  </div>
</main>

<footer>Drbak © 2026</footer>

<script>
function requestRide(){
  const from=document.getElementById('from').value.trim();
  const to=document.getElementById('to').value.trim();
  const payment=document.getElementById('payment').value;
  const city=document.getElementById('city').value;
  const result=document.getElementById('result');

  if(!from || !to){
    result.textContent='من فضلك أدخل مكان الانطلاق والوجهة.';
    return;
  }

  result.textContent='تم تجهيز تفاصيل طلبك التجريبي من '+
    from+' إلى '+to+' في '+city+
    '. طريقة الدفع: '+payment+
    '. الطلب غير مرسل لسائق حتى الآن.';
}
</script>
</body>
</html>
